<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full-Stack Optimized Dashboard</title>
    <style>
        body { font-family: sans-serif; background-color: #111; color: #fff; text-align: center; margin-top: 50px; }
        canvas { background-color: #000; border: 2px solid #555; }
        h1 { color: #00d2ff; }
        #stats { font-family: monospace; color: #888; margin-top: 16px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Full-Stack Optimized Web Interface (Node+Canvas)</h1>
    <canvas id="telemetryCanvas" width="600" height="400"></canvas>
    <div id="stats">FPS: -- | Messages: 0</div>
    
    <script type="text/javascript" charset="utf-8">
        const ws = new WebSocket(`ws://${location.host}`);
        
        // Decoupled state
        var latestMessage = "Waiting for data...";
        var hasNewMessage = false;
        var latestPubMonoNs = null;  // publisher's monotonic timestamp

        // --- Concern 1: frontend message counter ---
        var frontendMsgCount = 0;

        // --- Concern 4: publish-to-DISPLAY latency ---
        var displayLatencySamples = [];  // microseconds

        // --- Concern 5: frame-time distribution ---
        var frameTimeSamples = [];       // inter-frame intervals in ms
        var prevFrameTimestamp = 0;

        ws.onmessage = function(event) {
            latestMessage = event.data;
            hasNewMessage = true;
            frontendMsgCount++;
        };

        // --- Concern 5: FPS measurement via rAF timestamps ---
        var frameCount = 0;
        var lastFpsTime = 0;
        var currentFps = 0;

        // Hardware-accelerated 60 FPS Canvas rendering loop
        var canvas = document.getElementById('telemetryCanvas');
        var ctx = canvas.getContext('2d');
        var statsDiv = document.getElementById('stats');
        
        var urlParams = new URLSearchParams(window.location.search);
        var targetFps = parseInt(urlParams.get('fps')) || 144; // Default to unlocked Wayland vsync
        var minFrameTimeMs = targetFps === 144 ? 0 : (1000 / targetFps);
        var lastRenderTime = 0;

        function renderLoop(timestamp) {
            // Check if we need to throttle to 30 or 60 Hz
            if (minFrameTimeMs > 0 && (timestamp - lastRenderTime) < minFrameTimeMs) {
                requestAnimationFrame(renderLoop);
                return;
            }
            lastRenderTime = timestamp;

            // Frame-time distribution (Concern 5)
            if (prevFrameTimestamp > 0) {
                var intervalMs = timestamp - prevFrameTimestamp;
                frameTimeSamples.push(intervalMs);
            }
            prevFrameTimestamp = timestamp;

            // FPS calculation
            frameCount++;
            if (lastFpsTime === 0) lastFpsTime = timestamp;
            var elapsed = timestamp - lastFpsTime;
            if (elapsed >= 1000) {
                currentFps = (frameCount / (elapsed / 1000)).toFixed(1);
                statsDiv.textContent = `FPS: ${currentFps} | Messages received: ${frontendMsgCount}`;
                frameCount = 0;
                lastFpsTime = timestamp;
            }

            if (hasNewMessage) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00d2ff";
                ctx.font = "24px monospace";
                ctx.textAlign = "center";

                var displayMsg = latestMessage;
                var parts = latestMessage.split('|');
                if (parts.length >= 3 && !isNaN(parseFloat(parts[0]))) {
                    var backendWallMs = parseFloat(parts[0]);
                    var routingLatUs = parseFloat(parts[1]);
                    displayMsg = parts.slice(2).join('|');

                    var nowWallMs = performance.timeOrigin + performance.now();
                    var displayLatUs = routingLatUs + (nowWallMs - backendWallMs) * 1000.0;
                    displayLatencySamples.push(displayLatUs);
                } else if (parts.length >= 2) {
                    displayMsg = parts.slice(1).join('|');
                }

                ctx.fillText(displayMsg, canvas.width / 2, canvas.height / 2);
                hasNewMessage = false;
            }
            requestAnimationFrame(renderLoop);
        }
        
        requestAnimationFrame(renderLoop);

        // --- Report stats back to backend on page unload ---
        function reportStats() {
            var stats = {
                type: 'benchmark_stats',
                frontend_messages_received: frontendMsgCount,
                last_fps: parseFloat(currentFps) || 0,
                frame_time_samples_count: frameTimeSamples.length,
                display_latency_samples_count: displayLatencySamples.length
            };

            // Compute frame-time stats
            if (frameTimeSamples.length > 0) {
                var sorted = frameTimeSamples.slice().sort(function(a,b){return a-b;});
                var n = sorted.length;
                stats.frame_time_mean_ms = sorted.reduce(function(a,b){return a+b;},0) / n;
                stats.frame_time_median_ms = sorted[Math.floor(n/2)];
                stats.frame_time_p99_ms = sorted[Math.floor(n*0.99)];
                stats.frame_time_max_ms = sorted[n-1];
                stats.dropped_frames = sorted.filter(function(v){return v > 33.3;}).length;
            }

            // Compute display latency stats
            if (displayLatencySamples.length > 0) {
                var sorted = displayLatencySamples.slice().sort(function(a,b){return a-b;});
                var n = sorted.length;
                stats.display_latency_median_us = sorted[Math.floor(n/2)];
                stats.display_latency_p95_us = sorted[Math.floor(n*0.95)];
                stats.display_latency_p99_us = sorted[Math.floor(n*0.99)];
                stats.display_latency_mean_us = sorted.reduce(function(a,b){return a+b;},0) / n;
            }

            // Send to Node.js backend via WebSocket
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(stats));
            }
            console.log('[Benchmark Stats]', JSON.stringify(stats, null, 2));
        }

        window.addEventListener('beforeunload', reportStats);

        // Also report periodically in case beforeunload doesn't fire
        setInterval(function() {
            if (frontendMsgCount > 0) reportStats();
        }, 30000);
    </script>
</body>
</html>
