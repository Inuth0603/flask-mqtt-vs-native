<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full-Stack Optimized Dashboard</title>
    <style>
        body { font-family: sans-serif; background-color: #111; color: #fff; text-align: center; margin-top: 50px; }
        canvas { background-color: #000; border: 2px solid #555; }
        h1 { color: #00d2ff; }
    </style>
</head>
<body>
    <h1>Full-Stack Optimized Web Interface (Node+Canvas)</h1>
    <canvas id="telemetryCanvas" width="600" height="400"></canvas>
    
    <script type="text/javascript" charset="utf-8">
        const ws = new WebSocket(`ws://${location.host}`);
        
        // Decoupled state
        var latestMessage = "Waiting for data...";
        var hasNewMessage = false;

        ws.onmessage = function(event) {
            latestMessage = event.data;
            hasNewMessage = true;
        };

        // Hardware-accelerated 60 FPS Canvas rendering loop
        var canvas = document.getElementById('telemetryCanvas');
        var ctx = canvas.getContext('2d');
        
        function renderLoop() {
            if (hasNewMessage) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00d2ff";
                ctx.font = "24px monospace";
                ctx.textAlign = "center";
                ctx.fillText(latestMessage, canvas.width / 2, canvas.height / 2);
                hasNewMessage = false;
            }
            requestAnimationFrame(renderLoop);
        }
        
        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
